<title>三平台週報產生器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout：上方工具列（上傳／選週／複製），下方一張報表紙：合計 → 三平台卡片 → 三張 Top 5 → 三個操作方向 → 計算說明 */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#17202a; --muted:#5b6876; --line:#dbe1e7; --chip:#edf1f5;
  --accent:#1d4a73; --momo:#c2185b; --web:#00796b; --shopee:#d84f0c;
  --up:#1b7a3a; --down:#c42b2b; --upbg:#e3f4e8; --downbg:#fbe6e6;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --paper:#182029; --ink:#e5eaf0; --muted:#9aa7b5; --line:#2a3440; --chip:#212b36;
  --accent:#8db8e3; --momo:#f06a9b; --web:#4cb8a9; --shopee:#ff8c4d;
  --up:#62d18b; --down:#ff7f7f; --upbg:#173826; --downbg:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --paper:#182029; --ink:#e5eaf0; --muted:#9aa7b5; --line:#2a3440; --chip:#212b36;
  --accent:#8db8e3; --momo:#f06a9b; --web:#4cb8a9; --shopee:#ff8c4d;
  --up:#62d18b; --down:#ff7f7f; --upbg:#173826; --downbg:#3d1d1f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 工具列 */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.drop{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px dashed var(--line);
  border-radius:10px;background:var(--paper);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{color:var(--accent)}
.drop small{display:block;color:var(--muted);font-size:12.5px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button{cursor:pointer;font-weight:500}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--down)}

/* 報表紙 */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px max(20px,3vw);display:flex;flex-direction:column;gap:32px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,34px);letter-spacing:.02em}
.head .meta{color:var(--muted);font-size:13px;text-align:right}
.sec-title{font-family:var(--f-display);font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.sec-title small{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted)}
section{display:flex;flex-direction:column;gap:14px}

.total{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;padding:14px 18px;background:var(--chip);border-radius:10px}
.total .lbl{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.total .v{font-size:22px;font-weight:700}

.plats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.plats{grid-template-columns:1fr}}
.plat{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plat header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plat h3{font-size:18px;font-weight:700;color:var(--c)}
.plat .orders{font-size:12.5px;color:var(--muted)}
.big{font-size:28px;font-weight:700;line-height:1.15}
.sub{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.kpis div{min-width:0}
.kpis dt{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpis dd{margin:2px 0 0;display:flex;flex-direction:column;gap:2px}
.kpis small{font-size:11.5px;color:var(--muted)}
.pill{align-self:flex-start;font-family:var(--f-num);font-weight:700;font-size:14px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.up{background:var(--upbg);color:var(--up)}
.pill.down{background:var(--downbg);color:var(--down)}
.spark{width:100%;height:40px;display:block}
.spark-cap{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.tops{grid-template-columns:1fr}}
.top{min-width:0}
.top h3{font-size:15px;color:var(--c);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.top h3::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
td.rk{font-family:var(--f-num);font-weight:700;color:var(--c);width:1.6em}
.ret{display:inline-block;font-size:11px;color:var(--down);background:var(--downbg);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:a}
.advice li{counter-increment:a;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:4px 10px;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.advice li::before{content:counter(a);grid-row:span 2;font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1;color:var(--accent)}
.advice .t{font-weight:700}
.advice .b{color:var(--ink);font-size:14px;max-width:72ch}
.advice [contenteditable]:focus{outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px}
.hint{font-size:12.5px;color:var(--muted)}
.notes{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.notes ul{margin:4px 0 0;padding-left:1.2em}
.adgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.adgrid{grid-template-columns:1fr}}
@page{size:A4;margin:12mm 10mm}
@media print{
  body{background:#fff;padding:0;font-size:12.5px}
  .bar,.status,.toast{display:none!important}
  .wrap{max-width:none;gap:0}
  .paper{border:0;border-radius:0;padding:0;gap:22px;animation:none}
  .plats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tops,.adgrid{grid-template-columns:1fr;gap:14px}
  .top{break-inside:avoid}
  .notes{font-size:10.5px}
  .advice li{padding:10px 14px}
  .ads{break-before:page}
  .plat,.advice li,tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.paper{animation:in .35s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <div class="bar">
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept=".xlsx,.xls">
      <span>
        <b>上傳最新 Excel</b>（拖進來或點這裡）
        <small>Google 試算表 →「檔案」→「下載」→「Microsoft Excel (.xlsx)」，再把檔案放進來</small>
      </span>
    </label>
    <div class="ctl">
      <label for="week" class="hint">週期</label>
      <select id="week"></select>
      <button id="copy" class="primary" type="button">複製報表文字</button>
    </div>
  </div>
  <div class="status" id="status" role="status"></div>
  <div id="report"></div>
</div>
<div class="toast" id="toast" hidden></div>

  // 每日資料最後一天 → 推算年份
  let last=0;
  R.forEach((row,r)=>row.forEach((c,ci)=>{if(c==='日期'&&typeof row[ci+1]==='number'){row.forEach(v=>{if(typeof v==='number'&&v>40000&&v<60000&&v>last)last=v})}}));
  if(last){const d=serial(last);model.lastDaily=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;model.baseY=d.y;model.baseM=d.m}

  const weekSet=new Set();
  R.forEach((row,r)=>{row.forEach((c,ci)=>{
    if(c!=='日期'||!isWeek(row[ci+1]))return;
    const p=platKey(row[ci-1])||platKey(R[r-1]&&R[r-1][ci-1]);if(!p)return;
    const cols=[];for(let j=ci+1;isWeek(row[j]);j++)cols.push([j,normWeek(row[j])]);
    for(let rr=r+1;rr<=r+9&&rr<R.length;rr++){const lab=txt(R[rr][ci]);if(lab==='日期')break;const f=FIELD[lab];if(!f)continue;
      cols.forEach(([j,w])=>{(model.weekly[p][w]??={})[f]=n(R[rr][j])})}
    cols.forEach(([,w])=>weekSet.add(w));
  })});

  // Top 5
  R.forEach((row,r)=>{row.forEach((c,ci)=>{
    if(txt(c)!=='週期')return;
    const pr=R[r-1]||[];const starts=[];pr.forEach((v,j)=>{const p=platKey(v);if(p&&j>ci)starts.push([j,p])});
    starts.sort((a,b)=>a[0]-b[0]);
    const segs=starts.map(([s,p],i)=>{const end=i+1<starts.length?starts[i+1][0]:row.length;const idx=k=>{for(let j=s;j<end;j++)if(txt(row[j])===k)return j;return-1};
      return{p,name:idx('商品名稱'),qty:idx('訂購數'),bad:idx('取消/退貨數'),net:idx('淨銷量'),amt:idx('淨業績')}});
    for(let rr=r+1;rr<R.length&&isWeek(R[rr][ci]);rr++){const w=normWeek(R[rr][ci]);const T=(model.top5[w]??={momo:[],web:[],shopee:[]});

  })});

    let p=null;for(const k of[1,2])(R[r-k]||[]).forEach(v=>{p=p||platKey(v)});if(!p)return;const ei=row.findIndex(v=>txt(v)==='預估售完');
    for(let rr=r+1;rr<R.length;rr++){const nm=txt(R[rr][ni]);if(!nm||txt(R[rr][ni-1])==='備註')break;model.lowStock[p].push({name:nm,qty:n(R[rr][qi]),eta:ei>=0?txt(R[rr][ei]):''})}});

  // 月業績（去年同期用）
  M.forEach((row,r)=>{row.forEach((c,ci)=>{if(c!=='年月')return;const ai=row.indexOf('訂購金額');if(ai<0)return;
    let p=null;for(const k of[1,2,3])(M[r-k]||[]).forEach(v=>{p=p||platKey(v)});if(!p)return;
    for(let rr=r+1;rr<M.length&&typeof M[rr][ci]==='number';rr++){const d=serial(M[rr][ci]);const v=n(M[rr][ai]);if(v!=null)model.monthly[p][ym(d.y,d.m)]=v}})});

  model.ads=parseAds(wb);
  model.weeks=[...weekSet].map(w=>({w,start:weekStart(w,model)})).sort((a,b)=>a.start-b.start).map(x=>x.w);
  return model;
}

function weekStart(w,m){const[a]=w.split('-');const[mm,dd]=a.split('/').map(Number);const y=mm>m.baseM+1?m.baseY-1:m.baseY;return Date.UTC(y,mm-1,dd)}

function stats(w){const i=MODEL.weeks.indexOf(w);const pw=i>0?MODEL.weeks[i-1]:null;const start=weekStart(w,MODEL);const out={};

/* ---------- 畫面 ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=v=>v==null?'<span class="pill">—</span>':`<span class="pill ${v>=0?'up':'down'}">${v>=0?'▲':'▼'} ${Math.abs(v*100).toFixed(1)}%</span>`;
function spark(vals){const v=vals.map(x=>x??0);if(v.length<2)return'';const W=200,H=40,max=Math.max(...v,1),min=Math.min(...v,0);
  const pts=v.map((x,i)=>[4+i*(W-8)/(v.length-1),H-4-(x-min)/(max-min||1)*(H-10)]);const line=pts.map(p=>p.map(z=>z.toFixed(1)).join(',')).join(' ');
  const last=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="4,${H-4} ${line} ${last[0].toFixed(1)},${H-4}" fill="var(--c)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--c)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="var(--c)"/></svg>`}
const wkLabel=w=>w.replace('-','–');

function render(){const w=document.getElementById('week').value;if(!w)return;const S=stats(w);const T=MODEL.top5[w]||{momo:[],web:[],shopee:[]};const A=advice(w,S);
  const tot=PLATS.reduce((a,{k})=>a+(S[k].gross||0),0),totNet=PLATS.reduce((a,{k})=>a+(S[k].net||0),0),totPrevNet=PLATS.reduce((a,{k})=>a+(S[k].prevNet||0),0);
  const totOrd=PLATS.reduce((a,{k})=>a+(S[k].orders||0),0),totBad=PLATS.reduce((a,{k})=>a+S[k].cancel+S[k].ret,0);
  const lyAll=PLATS.every(({k})=>S[k].ly!=null)?PLATS.reduce((a,{k})=>a+S[k].ly,0):null;
  const n8=Math.min(8,MODEL.weeks.indexOf(w)+1);
  document.getElementById('report').innerHTML=`<article class="paper" id="paper">
  <div class="head"><div><div class="hint">三平台週報</div><h1>${wkLabel(w)} 週業績</h1></div>
    <div class="meta">momo · 官網 · 蝦皮<br>資料更新至 ${MODEL.lastDaily||'—'}</div></div>
  <section><h2 class="sec-title">業績總覽<small>大字＝淨業績（訂購 − 取消 − 退貨）</small></h2>
    <div class="total"><div><div class="lbl">三平台淨業績合計</div><div class="v num">${$n(totNet)}</div>
        <div class="sub num">${totOrd} 筆訂單 · 取消＋退貨 ${$n(totBad)}</div></div>
      <div><div class="lbl">合計 WoW</div>${pill(totPrevNet?totNet/totPrevNet-1:null)}</div>
      ${lyAll?`<div><div class="lbl">合計與去年同期比</div>${pill(tot/lyAll-1)}</div>`:''}</div>
    <div class="plats">${PLATS.map(({k,n:nm,c})=>{const s=S[k];return`<article class="plat" style="--c:${c}">
      <header><h3>${nm}</h3><span class="orders">淨業績</span></header>
      <div><div class="big num">${$n(s.net)}</div><div class="sub"><span class="num">${s.orders??'—'}</span> 筆訂單 · 取消＋退貨 <span class="num">${$n(s.cancel+s.ret)}</span></div></div>
      <dl class="kpis"><div><dt>WoW 週成長</dt><dd>${pill(s.wow)}<small>上週淨業績 ${$n(s.prevNet)}</small></dd></div>
        <div><dt>與去年同期比</dt><dd>${pill(s.yoy)}<small>${s.ly!=null?'去年同週估 '+$n(s.ly):'Excel 沒有去年資料'}</small></dd></div></dl>
      <div>${spark(s.series)}<div class="spark-cap"><span>近 ${n8} 週淨業績</span><span>本週</span></div></div></article>`}).join('')}</div>
  </section>
  <section><h2 class="sec-title">各平台銷售 Top 5<small>依淨業績排序</small></h2>
    <div class="tops">${PLATS.map(({k,n:nm,c})=>{const L=(T[k]||[]).slice(0,5);return`<div class="top" style="--c:${c}"><h3>${nm}</h3>${L.length?`<div class="tbl"><table>
      <thead><tr><th></th><th>商品</th><th class="r">淨銷量</th><th class="r">淨業績</th></tr></thead><tbody>
      ${L.map((x,i)=>`<tr><td class="rk">${i+1}</td><td>${esc(x.name)}${x.bad?`<span class="ret">退 ${x.bad}</span>`:''}</td><td class="r num">${x.net??'—'}</td><td class="r num">${$n(x.amt)}</td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">這週沒有 Top 5 資料</div>'}</div>`}).join('')}</div>
  </section>
  <section class="advice-sec"><h2 class="sec-title">未來操作方向<small>依本週數據自動產生，可直接點文字修改</small></h2>
    <ol class="advice" id="advice">${A.map(a=>`<li><div class="t" contenteditable="true">${esc(a.t)}</div><div class="b" contenteditable="true">${esc(a.b)}</div></li>`).join('')}</ol>
  </section>
  ${renderAds()}
  <div class="notes"><b>計算方式</b><ul>
    <li>週業績、WoW、Top 5 取自「業績表」分頁的「二、一週業績」和「三、本週銷售 Top 5」。</li>
    <li>淨業績＝訂購金額 − 取消金額 − 退貨金額（蝦皮目前沒有取消、退貨資料，淨業績＝訂購金額）。WoW＝本週淨業績 ÷ 上週淨業績 − 1。</li>
    <li>與去年同期比：Excel 只有去年的「月業績」訂購金額，所以用今年本週訂購金額比去年同週估算值（去年同月訂購金額 ÷ 當月天數 × 該週落在那個月的天數）。蝦皮沒有去年資料，顯示「—」。</li>
    <li>缺貨提醒取自「四、低庫存提醒」；廣告數據取自「廣告代理商數據」與「廣告分析」（GA4），期間以各表標示為準，不一定和本週對齊。</li></ul></div>
</article>`}

function copyText(){const w=document.getElementById('week').value;if(!w)return;const S=stats(w);const T=MODEL.top5[w]||{};
  const L=[`【三平台週報 ${wkLabel(w)}】`,''];
  PLATS.forEach(({k,n:nm})=>{const s=S[k];L.push(`■ ${nm}`,`淨業績 ${$n(s.net)}（${s.orders??'—'} 筆訂單，取消＋退貨 ${$n(s.cancel+s.ret)}）`,`WoW ${pct(s.wow)}（上週淨業績 ${$n(s.prevNet)}）`,
    `與去年同期比 ${s.yoy==null?'—（無去年資料）':pct(s.yoy)+'（去年同週估 '+$n(s.ly)+'）'}`,'Top 5：');
    (T[k]||[]).slice(0,5).forEach((x,i)=>L.push(`${i+1}. ${x.name}｜${x.net??'—'} 件｜${$n(x.amt)}`));L.push('')});
  L.push('■ 未來操作方向');document.querySelectorAll('#advice li').forEach((li,i)=>L.push(`${i+1}. ${li.querySelector('.t').innerText.trim()}：${li.querySelector('.b').innerText.trim()}`));
  const ad=document.querySelectorAll('#adadvice li');if(ad.length){L.push('','■ 廣告建議');ad.forEach((li,i)=>L.push(`${i+1}. ${li.querySelector('.t').innerText.trim()}：${li.querySelector('.b').innerText.trim()}`))}
  const text=L.join('\n');
  const done=()=>toast('已複製，可直接貼到 LINE 或 Email');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?done():toast('複製失敗，請手動選取報表文字')}catch(e){toast('複製失敗，請手動選取報表文字')}ta.remove()};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2400)}
function status(m,err){const s=document.getElementById('status');s.textContent=m;s.className='status'+(err?' err':'')}

function load(model,src){MODEL=model;window.__model=model;const sel=document.getElementById('week');
  if(!model.weeks.length){status('在這個檔案裡找不到「一週業績」資料，請確認是同一份 Excel。',true);return}
  const has=w=>PLATS.some(({k})=>(model.weekly[k][w]||{}).gross);const latest=[...model.weeks].reverse().find(has)||model.weeks[model.weeks.length-1];
  sel.innerHTML=[...model.weeks].reverse().map(w=>`<option value="${w}">${wkLabel(w)}${w===latest?'（最新）':''}</option>`).join('');sel.value=latest;
  status(src);render()}
function readFile(f){if(!f)return;status('讀取中…');const fr=new FileReader();fr.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const m=parseWorkbook(wb);load(m,`已讀取「${f.name}」：找到 ${m.weeks.length} 週資料，顯示最新一週。`)}catch(err){status('讀不了這個檔案：請確認是 .xlsx 格式（Google 試算表 → 檔案 → 下載 → Excel）。',true)}};fr.readAsArrayBuffer(f)}

document.getElementById('file').addEventListener('change',e=>readFile(e.target.files[0]));
document.getElementById('week').addEventListener('change',render);
document.getElementById('copy').addEventListener('click',copyText);
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));

try{const seed=JSON.parse(document.getElementById('seed').textContent.replace('/*SEED*/',''));if(seed)load(seed,`目前顯示 ${seed.lastDaily||''} 擷取的資料。下週上傳新的 Excel 就會自動更新。`)}catch(e){}
if(!MODEL)status('上傳 Excel 後會自動產生報表。');
</script>
